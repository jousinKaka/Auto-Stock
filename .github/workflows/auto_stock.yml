name: Auto Stock 24/7 Cloud Routine

on:
  schedule:
    # 1) 매일 아침 09:00 KST (00:00 UTC, 월~금) -> 야간 체결 확인 & 모닝 리포트 발송
    - cron: '0 0 * * 1-5'
    # 2) 매일 저녁 20:00 KST (11:00 UTC, 월~금) -> 오늘 밤 To-Do 매매 주문 접수 & 텔레그램 발송
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # 깃허브 웹 화면에서 "Run workflow" 버튼으로 수동 즉시 실행 가능

permissions:
  contents: write

jobs:
  trade_and_report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Stock Pipeline
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ: ${{ secrets.TOSS_ACCOUNT_SEQ }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOTAL_BUDGET_USD: ${{ vars.TOTAL_BUDGET_USD || '30000.0' }}
          PYTHONIOENCODING: 'utf-8'
        run: |
          # morning_routine.py 실행 (토스 API 연동 및 텔레그램 리포트 자동 발송)
          python morning_routine.py

      - name: Commit & Push Updated Ledger and Reports
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trade_history.json data/reports/
          git diff --staged --quiet || git commit -m "chore(auto): update trade ledger and daily report [skip ci]"
          git push

