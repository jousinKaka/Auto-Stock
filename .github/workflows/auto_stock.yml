name: Auto Stock 24/7 Cloud Routine

on:
  schedule:
    # 1) 매일 아침 09:00 KST (00:00 UTC, 월~금) -> 야간 체결 확인 & 모닝 리포트 발송
    - cron: '0 0 * * 1-5'
    # 2) 매일 저녁 20:00 KST (11:00 UTC, 월~금) -> 오늘 밤 To-Do 매매 주문 접수 & 텔레그램 발송
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      confirm_live_buy_only:
        description: "Explicitly confirm a live buy-only run (otherwise Dry-Run)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-stock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trade_and_report:
    runs-on: [self-hosted, linux, x64, toss-static-ip]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Stock Pipeline (Live, Evening Schedule Only)
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1-5' && vars.ENABLE_LIVE_TRADING == 'true' && vars.LIVE_BUY_LIMIT_USD != '') || (github.event_name == 'workflow_dispatch' && inputs.confirm_live_buy_only == true && vars.ENABLE_LIVE_TRADING == 'true' && vars.LIVE_BUY_LIMIT_USD != '') }}
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ: ${{ secrets.TOSS_ACCOUNT_SEQ }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOTAL_BUDGET_USD: ${{ vars.TOTAL_BUDGET_USD || '30000.0' }}
          AUTO_STOCK_STATE_DIR: /home/ubuntu/.local/state/auto-stock
          PYTHONIOENCODING: 'utf-8'
          CONFIRM_LIVE_BUY_ONLY: ${{ inputs.confirm_live_buy_only }}
        run: |
          if [ "$CONFIRM_LIVE_BUY_ONLY" = "true" ] || [ "$(TZ=Asia/Seoul date +%F)" = "2026-10-19" ]; then
            python morning_routine.py --live --buy-only --max-live-buy-notional-usd "${{ vars.LIVE_BUY_LIMIT_USD }}"
          else
            python morning_routine.py --live --max-live-buy-notional-usd "${{ vars.LIVE_BUY_LIMIT_USD }}"
          fi

      - name: Run Auto Stock Pipeline (Dry-Run)
        if: ${{ !((github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1-5' && vars.ENABLE_LIVE_TRADING == 'true' && vars.LIVE_BUY_LIMIT_USD != '') || (github.event_name == 'workflow_dispatch' && inputs.confirm_live_buy_only == true && vars.ENABLE_LIVE_TRADING == 'true' && vars.LIVE_BUY_LIMIT_USD != '')) }}
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ: ${{ secrets.TOSS_ACCOUNT_SEQ }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOTAL_BUDGET_USD: ${{ vars.TOTAL_BUDGET_USD || '30000.0' }}
          AUTO_STOCK_STATE_DIR: /home/ubuntu/.local/state/auto-stock
          PYTHONIOENCODING: 'utf-8'
        run: |
          python morning_routine.py

      - name: Commit & Push Updated Ledger and Reports
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trade_history.json data/reports/
          git diff --staged --quiet || git commit -m "chore(auto): update trade ledger and daily report [skip ci]"
          git push
