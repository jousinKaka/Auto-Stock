name: Auto Stock 24/7 Cloud Routine

on:
  workflow_dispatch:
    inputs:
      confirm_live_buy_only:
        description: "Explicitly confirm a live buy-only run (otherwise Dry-Run)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-stock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trade_and_report:
    runs-on: [self-hosted, linux, x64, toss-static-ip]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Stock Pipeline (Manual Live Buy-Only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_live_buy_only == true && vars.ENABLE_LIVE_TRADING == 'true' && vars.LIVE_BUY_LIMIT_USD != '' }}
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ: ${{ secrets.TOSS_ACCOUNT_SEQ }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOTAL_BUDGET_USD: ${{ vars.TOTAL_BUDGET_USD || '30000.0' }}
          AUTO_STOCK_STATE_DIR: /home/ubuntu/.local/state/auto-stock
          PYTHONIOENCODING: 'utf-8'
        run: |
          if [ "$(TZ=Asia/Seoul date +%H)" -ge 12 ]; then
            export AUTO_STOCK_ROUTINE=evening
          else
            export AUTO_STOCK_ROUTINE=morning
          fi
          python morning_routine.py --live --buy-only --max-live-buy-notional-usd "${{ vars.LIVE_BUY_LIMIT_USD }}"

      - name: Run Auto Stock Pipeline (Dry-Run)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.confirm_live_buy_only == true && vars.ENABLE_LIVE_TRADING == 'true' && vars.LIVE_BUY_LIMIT_USD != '') }}
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ: ${{ secrets.TOSS_ACCOUNT_SEQ }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOTAL_BUDGET_USD: ${{ vars.TOTAL_BUDGET_USD || '30000.0' }}
          AUTO_STOCK_STATE_DIR: /home/ubuntu/.local/state/auto-stock
          PYTHONIOENCODING: 'utf-8'
        run: |
          if [ "$(TZ=Asia/Seoul date +%H)" -ge 12 ]; then
            export AUTO_STOCK_ROUTINE=evening
          else
            export AUTO_STOCK_ROUTINE=morning
          fi
          python morning_routine.py

      - name: Commit & Push Updated Ledger and Reports
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trade_history.json data/reports/
          git diff --staged --quiet || git commit -m "chore(auto): update trade ledger and daily report [skip ci]"
          git push
